<!doctype html>
<meta charset="utf-8">
<title>Native keyboard controls fixture</title>
<button id="first" autofocus>First</button>
<button id="second">Second</button>
<button id="third">Third</button>
<script>
  window.keyboardFixture = { clicks: [], events: [] };
  for (const button of document.querySelectorAll("button")) {
    button.addEventListener("click", event => keyboardFixture.clicks.push({ id: button.id, trusted: event.isTrusted }));
  }
  for (const type of ["keydown", "keyup"]) {
    document.addEventListener(type, event => keyboardFixture.events.push({ type, key: event.key, code: event.code,
      shift: event.shiftKey, trusted: event.isTrusted, target: event.target.id }));
  }
</script>
